<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Show Widget · Interactive clarification forms</title>
    <link rel="stylesheet" href="src/app.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="app-header">
        <div class="app-logo">W</div>
        <div>
          <div class="app-title">Show Widget</div>
          <div class="app-subtitle" id="status">Checking server…</div>
        </div>
        <div class="spacer"></div>
        <div class="mode-toggle" role="tablist" aria-label="Conversation mode">
          <button id="mode-offline" class="active" type="button">Offline demo</button>
          <button id="mode-online" type="button">Online (AI)</button>
        </div>
      </header>

      <!-- Conversation -->
      <main class="messages" id="messages" aria-live="polite"></main>

      <!-- Suggested scenarios -->
      <div class="suggestions" id="suggestions"></div>

      <!-- Message composer -->
      <footer class="composer">
        <textarea
          id="composer-input"
          rows="1"
          placeholder="Offline demo: choose a scenario below, or type to see instructions…"
        ></textarea>
        <button class="send-btn" id="send-btn" type="button" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2 11 13" />
            <path d="M22 2 15 22l-4-9-9-4 20-7z" />
          </svg>
        </button>
      </footer>
    </div>

    <!-- Mobile fullscreen widget overlay -->
    <div class="overlay" id="overlay">
      <div class="overlay-sheet" id="overlay-sheet"></div>
    </div>

    <script src="src/widget-host.js" defer></script>
  </body>
</html>
